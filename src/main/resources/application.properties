spring.config.import=optional:file:.env[.properties]
spring.application.name=catalogocursos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catalogocursos_dev}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=catalogocursos
app.security.jwt.expiration=PT30M
app.security.refresh.idle-timeout=PT30M
app.security.refresh.absolute-expiration=P7D
app.security.protection.max-failed-attempts=5
app.security.protection.failure-window=PT15M
app.security.protection.lock-duration=PT15M
app.security.initial-admin.enabled=${INITIAL_ADMIN_ENABLED:false}
app.security.initial-admin.login=${INITIAL_ADMIN_LOGIN:}
app.security.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-flat-param-object=true
